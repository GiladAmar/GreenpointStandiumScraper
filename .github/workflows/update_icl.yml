name: Generate DHL Stadium ICS

on:
  # Schedule: 01:00 UTC every 2 weeks (1st and 15th of every month)
  schedule:
    - cron: '0 1 1,15 * *'

  # Run on push to master branch
  push:
    branches:
      - master

  workflow_dispatch: # manual trigger

jobs:
  # The calendar is published straight to master, so the tests gate the build
  # rather than running after it. A broken scraper should never reach the file
  # people subscribe to.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements_dev.txt

      - name: Run tests
        run: python -m pytest test_events.py -q

  generate-ics:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo and allow push with GITHUB_TOKEN
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false  # We'll handle token manually

      # 2️⃣ Set up Python (setup-python caches pip itself now)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4️⃣ Generate the ICS. This fails the job rather than publishing a
      #    calendar that has lost most of its events to a broken source.
      - name: Generate ICS
        run: python generate_dhl_ics.py

      # 5️⃣ Commit and push the calendar and its health report
      - name: Commit and push ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dhl_stadium.ics events.json health.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update DHL Stadium ICS"

          # Use HTTPS with token to push
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/GiladAmar/GreenpointStandiumScraper.git
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6️⃣ Report sources that have quietly stopped reading their live date, or
      #    a stadium feed that has stopped reaching into the future. Runs after
      #    the push on purpose: a computed date still beats no calendar, so the
      #    build publishes and the workflow goes red for someone to look at.
      - name: Check source health
        run: python generate_dhl_ics.py --check-health
